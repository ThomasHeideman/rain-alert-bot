name: Raib-Alert-Bot
on:
  schedule:
    - cron: '0 7 * * *'  # Elke ochtend om 07:00 UTC (08:00 NL tijd)
  workflow_dispatch:      # Hiermee kun je de knop "Run workflow" handmatig indrukken op GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: install libraries
        run: pip install requests

      - name: Run Script
        env:
          # Hier koppel je de GitHub Secrets (instellingen) aan de code
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py
